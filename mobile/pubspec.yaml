name: mobile
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  equatable: ^2.0.7
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  socket_io_client: ^3.1.2
  flutter_pdfview: ^1.4.1+1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  pdfx: ^2.6.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  rxdart: ^0.28.0
  flutter_launcher_icons: ^0.14.4
  lottie: ^3.3.1
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/pray.png
    - assets/lottie/social.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/pray.png"

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: false
